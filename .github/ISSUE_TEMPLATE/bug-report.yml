name: Bug report
description: Something in the Kivotos plugin is broken or doesn't behave the way it should.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Issues are only for bugs. Feature ideas and questions go in [GitHub Discussions](https://github.com/Rinai-R/kivotos/discussions).

        Security problems must not be reported here. Use [private vulnerability reporting](https://github.com/Rinai-R/kivotos/security/advisories/new).

        Before opening, please search existing issues and try to reproduce on the latest commit. For layout bugs, attach a screenshot.

  - type: textarea
    id: description
    attributes:
      label: What's broken
      description: What happened, and what did you expect instead?
      placeholder: |
        I opened another machine from the machine switcher, expected its sessions, got Z.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The shortest sequence that triggers the bug. If you can't reproduce on demand, say so.
      placeholder: |
        1. Open http://100.x.y.z:7380/ on the phone
        2. Open the drawer
        3. Tap X
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where did this happen
      options:
        - Computer, this machine's dsh
        - Computer, another machine through the switcher
        - Phone browser
        - Tailnet listener / discovery (no UI)
        - Other
    validations:
      required: true

  - type: input
    id: kivotos-version
    attributes:
      label: Kivotos commit or version
      description: "`git rev-parse --short HEAD` in your clone, or the version in packages/kivotos/package.json."
    validations:
      required: true

  - type: input
    id: dsh-version
    attributes:
      label: DeepSeek Harness version
      description: "`dsh --version`. Kivotos targets 0.2.0-rc.2."
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: OS, browser, Tailscale version
      placeholder: "macOS 15.2 + Chrome 141, Android 15 + Chrome, Tailscale 1.104.1"
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Kivotos config
      description: The `kivotos` entry from `dsh --profile <profile> --dump-config`, if you changed anything.
      render: yaml

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        dsh's terminal output around the time of the bug (lines starting with `kivotos:` matter most) and the browser console. Paste raw output, not a summary. Remove tokens from any `?token=` URL.
      render: text

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Required for layout bugs. Include the viewport size and whether the theme was light or dark.
