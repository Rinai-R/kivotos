name: Bug report
description: Report something in Kivotos that is broken.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This form is for bugs. Report security problems privately: https://github.com/Rinai-R/kivotos/security/advisories/new

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      description: The shortest steps that show it. Say so if it happens only sometimes.
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: Where
      multiple: true
      options:
        - Desktop app
        - dsh in a browser
        - Another machine opened from the machine switcher
        - Android app
        - Relay server
        - Notifications
    validations:
      required: true

  - type: dropdown
    id: link
    attributes:
      label: Connection
      multiple: true
      options:
        - Tailscale
        - Own relay
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      description: Kivotos, DeepSeek Harness, Android app or relay image, and the operating systems involved.
      placeholder: "Kivotos 0.1.5, dsh 0.2.0-rc.2 desktop, macOS 15, Android 15"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Useful sources: `$DSH_HOME/kivotos/logs/trace-<date>.jsonl` around the time of the problem, dsh's output (lines starting with `kivotos:`), crash reports of the desktop app under `~/Library/Logs/DeepSeek Harness/`, and `adb logcat` for the app. Remove any `?token=` from URLs.
      render: text

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: For anything visual.
