name: Nix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Update lockfile + Nix hash if stale
        run: ./scripts/update-nix.sh

      - name: Build Nix package
        run: nix build .#default -o result

      - name: Smoke Nix daemon
        run: |
          set -euo pipefail

          export KIVOTOS_HOME
          KIVOTOS_HOME="$(mktemp -d)"
          export KIVOTOS_LISTEN=127.0.0.1:6767

          WRAPPER_LOG="$KIVOTOS_HOME/kivotos-cli.log"

          cleanup() {
            if [[ -n "${DAEMON_PID:-}" ]] && kill -0 "$DAEMON_PID" 2>/dev/null; then
              kill "$DAEMON_PID"
              wait "$DAEMON_PID" || true
            fi
            rm -rf "$KIVOTOS_HOME"
          }
          trap cleanup EXIT

          KIVOTOS_WEB_UI_ENABLED=true KIVOTOS_RELAY_ENABLED=false ./result/bin/kivotos daemon run >"$WRAPPER_LOG" 2>&1 &
          DAEMON_PID=$!

          deadline=$((SECONDS + 30))
          while (( SECONDS < deadline )); do
            if STATUS_JSON="$(./result/bin/kivotos daemon status --json)" \
              && jq -e '.connectedDaemon == "reachable"' <<<"$STATUS_JSON" >/dev/null; then
              echo "$STATUS_JSON"
              curl --fail --silent --show-error http://127.0.0.1:6767/ >"$KIVOTOS_HOME/web-ui.html"
              [[ -s "$KIVOTOS_HOME/web-ui.html" ]]
              if ! TERMINAL_JSON="$(./result/bin/kivotos terminal create --cwd "$KIVOTOS_HOME" --name nix-smoke --json)"; then
                break
              fi
              TERMINAL_ID="$(jq -er '.id' <<<"$TERMINAL_JSON")"
              ./result/bin/kivotos terminal send-keys "$TERMINAL_ID" 'PATH= "$KIVOTOS_HOOK_CLI" --version && printf "nix-terminal-%s\n" ok' Enter
              deadline=$((SECONDS + 15))
              while (( SECONDS < deadline )); do
                if ./result/bin/kivotos terminal capture "$TERMINAL_ID" --json \
                  | jq -e '.lines | any(. == "nix-terminal-ok")' >/dev/null; then
                  ./result/bin/kivotos terminal kill "$TERMINAL_ID"
                  exit 0
                fi
                sleep 1
              done
              echo "Nix terminal did not execute the command."
              break
            fi

            if ! kill -0 "$DAEMON_PID" 2>/dev/null; then
              echo "Nix daemon exited before becoming reachable."
              break
            fi

            sleep 1
          done

          echo "::group::daemon.log"
          cat "$KIVOTOS_HOME/daemon.log" 2>/dev/null || echo "<missing>"
          echo "::endgroup::"

          echo "::group::kivotos daemon run stdout/stderr"
          cat "$WRAPPER_LOG" 2>/dev/null || echo "<missing>"
          echo "::endgroup::"

          echo "::group::kivotos daemon status"
          ./result/bin/kivotos daemon status || true
          echo "::endgroup::"

          exit 1

      - name: Build Nix desktop package
        run: nix build .#desktop -o result-desktop

  build-desktop-darwin:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build Nix desktop package
        run: nix build .#desktop -o result-desktop

      - name: Verify macOS application bundle
        run: |
          set -euo pipefail

          app="result-desktop/Applications/Kivotos.app"
          test -x "$app/Contents/MacOS/Kivotos"
          test -L result-desktop/bin/kivotos-desktop
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = "sh.kivotos.desktop"
          find "$app" -name Info.plist -print0 | xargs -0 -n 1 plutil -lint
