name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # dsh 0.2.1-alpha.1 supports ^22.19.0 || >=24.
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # npm ci runs the plugin's prepare script, which builds dist/.
      - name: Install and build
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check build output
        run: test -s packages/kivotos/dist/index.js && test -s packages/kivotos/dist/client.js

      - name: Test
        run: npm test

  android:
    name: android apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # React Native's Gradle plugin builds with a Java 17 toolchain.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install
        run: npm ci

      # `android/` is generated from app.json and the local module; it is not committed.
      - name: Generate native project
        working-directory: packages/mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        working-directory: packages/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: kivotos-android
          path: packages/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
