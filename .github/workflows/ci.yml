name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Kivotos declares node ^22.19.0 || >=24 (packages/kivotos/package.json engines).
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # npm ci runs the plugin's prepare script, which builds dist/.
      - name: Install and build
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check build output
        run: test -s packages/kivotos/dist/index.js && test -s packages/kivotos/dist/client.js

      - name: Test
        run: npm test

      - name: Verify tag matches package and app versions
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e 'const fs = require("node:fs"); const version = process.env.TAG.slice(1); for (const file of ["package.json", "packages/kivotos/package.json", "packages/mobile/package.json", "packages/mobile/app.json"]) { const data = JSON.parse(fs.readFileSync(file)); const actual = data.expo?.version ?? data.version; if (actual !== version) { console.error(`${file}: expected ${version}, found ${actual}`); process.exitCode = 1; } }'

      # The release job publishes this section as the GitHub Release description.
      - name: Verify the changelog describes the tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! grep -qxF "## ${TAG}" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md has no \"## ${TAG}\" section."
            exit 1
          fi

  relay:
    name: relay (go)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/relay
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/relay/go.mod
          cache-dependency-path: packages/relay/go.sum

      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build -o kivotos-relay .

      # The image must start as its non-root user and be able to write its volume.
      - name: Build and start the container image
        run: |
          docker build -t kivotos-relay --build-arg VERSION=ci .
          docker run --rm kivotos-relay --version
          docker run -d --name relay kivotos-relay
          sleep 2
          docker exec relay kivotos-relay host list
          docker exec relay wget -q -O /dev/null http://127.0.0.1:7443/healthz
          docker stop relay
          docker logs relay

  android:
    name: android apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # React Native's Gradle plugin builds with a Java 17 toolchain.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install
        run: npm ci

      # `android/` is generated from app.json and the local module; it is not committed.
      - name: Generate native project
        working-directory: packages/mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        working-directory: packages/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: kivotos-android
          path: packages/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  npm:
    name: publish npm package
    if: startsWith(github.ref, 'refs/tags/')
    needs: [check, android]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm provenance: a signed statement that this CI run built the package.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      # npm ci runs the plugin's prepare script, which builds dist/.
      - name: Install and build
        run: npm ci

      # npm shows the README and license that sit in the package directory.
      - name: Add README and license to the package
        run: cp README.md LICENSE NOTICE packages/kivotos/

      - name: Publish kivotos
        working-directory: packages/kivotos
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::The NPM_TOKEN secret is not set."
            exit 1
          fi
          version="${TAG#v}"
          # A rerun after a later job failed must not fail on the version already published.
          if npm view "kivotos@${version}" version >/dev/null 2>&1; then
            echo "kivotos@${version} is already on npm; skipping."
            exit 0
          fi
          # Prereleases go to the "next" dist-tag so they never become "latest".
          if [[ "$TAG" == *-* ]]; then
            npm publish --tag next
          else
            npm publish
          fi

  release:
    name: publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [check, android, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: kivotos-android
          path: release

      - name: Prepare APK and checksum
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mv release/app-release.apk "release/Kivotos-${TAG}.apk"
          cd release
          sha256sum "Kivotos-${TAG}.apk" > "Kivotos-${TAG}.sha256"

      # The description is the tag's section of CHANGELOG.md, up to the next "## " heading.
      - name: Extract release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v heading="## ${TAG}" '$0 == heading { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error file=CHANGELOG.md::The \"## ${TAG}\" section of CHANGELOG.md is empty."
            exit 1
          fi

      # --generate-notes appends GitHub's "Full Changelog" link below the description.
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" == *-* ]]; then
            gh release create "$TAG" release/* --verify-tag --notes-file notes.md --generate-notes --prerelease --title "$TAG"
          else
            gh release create "$TAG" release/* --verify-tag --notes-file notes.md --generate-notes --title "$TAG"
          fi
