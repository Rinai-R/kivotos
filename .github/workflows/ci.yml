name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # CI does not use the CUDA execution provider, and the onnxruntime-node
  # postinstall download from NuGet is large enough to make npm ci flaky.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Build workspace dependencies
        run: npm run build:server-deps

      - name: protocol
        run: npm run test --workspace=@kivotos/protocol

      - name: client
        run: npm run test --workspace=@kivotos/client

      - name: relay
        run: npm run test --workspace=@kivotos/relay

      - name: plugin
        run: npm run test --workspace=@kivotos/plugin

      - name: highlight
        run: npm run test --workspace=@kivotos/highlight

      - name: built-in plugins
        run: npm run test --workspace=@kivotos/builtin-plugins

      - name: cli
        timeout-minutes: 15
        run: npm run test:unit --workspace=@kivotos/cli

      - name: server
        timeout-minutes: 30
        run: npm run test:unit --workspace=@kivotos/server

      - name: app
        timeout-minutes: 30
        run: npm run test --workspace=@kivotos/app
