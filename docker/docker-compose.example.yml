# Minimal Kivotos daemon + web UI deployment.
#
# Open http://localhost:6767 after `docker compose up -d`.
# For any network-reachable deployment, change KIVOTOS_PASSWORD first.
services:
  kivotos:
    image: ghcr.io/getkivotos/kivotos:latest
    container_name: kivotos
    restart: unless-stopped
    ports:
      - "6767:6767"
    environment:
      KIVOTOS_PASSWORD: "change-me"
      # Add DNS names you use to reach this container. IPs and localhost are
      # already allowed by default.
      # KIVOTOS_HOSTNAMES: "kivotos.example.com,.lan"
    volumes:
      # Persistent daemon state and agent credentials/config.
      - ./kivotos-home:/home/kivotos
      # Code visible to Kivotos and the agents it launches.
      - ./workspace:/workspace
