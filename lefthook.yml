# Git hooks (https://lefthook.dev). `npm install` sets them up.
pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{css,js,json,jsonc,jsx,md,ts,tsx,yaml,yml}"
      exclude:
        - "package-lock.json"
        - "**/package-lock.json"
      run: npm run format:check:files -- {staged_files}
    lint:
      glob: "*.{js,jsx,ts,tsx}"
      run: npm run lint -- {staged_files}
    typecheck:
      run: npm run typecheck
